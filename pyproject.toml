[project]
name = "transradial-limb-sim"
version = "0.1.0"
description = "Physics simulation of transradial prosthesis actuation with tendon and motor models."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emre Yilmaz" }]
keywords = ["prosthetics", "simulation", "actuation", "biomechanics", "python"]
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transradial_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the default run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/transradial_sim"]
